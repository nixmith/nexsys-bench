# rejoin-race-operator — the C2 rejoin-race class, ported to a scripted
# OPERATOR scenario (B3 DP-7). It needs hands — a device power-cycle timed
# against the command plane — so it is OPERATOR tier and NEVER enters the
# nightly (`suite auto` structurally refuses OPERATOR names; `suite all`
# defers them). Run it at an attended session: bench.sh scenario
# rejoin-race-operator (interactive TTY required — the C-1 lesson: over
# `ssh pi '<cmd>'` the ENTER gate does not wait).
#
# THE CLASS CONTRACT (ruled, B3 DP-7): a command issued while its target is
# MID-REJOIN must terminal HONESTLY — CONFIRMED only on real evidence, else
# TIMED_OUT/UNCONFIRMED-class. Never-false-CONFIRMED is the assert; the
# DISPOSITION IS DELIBERATELY OPEN, so the machine assert is the
# disposition-agnostic terminal (field_equals data.terminal true — the
# command-s31-settle precedent: reaches SOME terminal, both dispositions
# honest). The operator block's paste-backs (the terminal read + the state
# read + the act timestamps) are what let the hub adjudicate WHICH terminal
# it was and whether a CONFIRMED rode real evidence.
#
# Target: the S31 Lite zb switch (${C.command.s31-entity} — mains-powered,
# relay reports its own state, carries no load since the 2026-07-29 Hue
# unplug). The mid-rejoin premise is EVIDENCED, not assumed: the
# device-scoped relink positive (same_line on the S31's IEEE,
# ${C.command.s31-ieee} — minted from the F-12 instrument line) proves the
# power-cycle actually happened; without it, a no-op ENTER would vacuously
# green an ordinary confirm.
#
# Timing: press ENTER the moment the supply is restored, and the POST fires
# immediately after — the S31's rejoin (device_announce → relink) takes
# seconds, so the command lands while the rejoin is in flight. If the
# operator dawdles and the relink beats the POST, the rep degrades to an
# ordinary confirm (still honest, no false claim) — the hub reads rep
# quality from the bundle's marker/relink timestamps and orders a re-run.
#
# Token sources: zigbee.device_relinked ZigbeeAdoptionSlice.java:513 ·
# device_proposed / network_parameter_mismatch bind the standing UNPREFIXED
# grep forms (boot-health.yaml header) — a mid-rejoin power-cycle must
# RELINK, never re-propose (identity law; a proposal fails the rep with the
# hit quoted). Command wire paths: constants.yaml command-lifecycle block
# (B2 re-pin set); POST body capability+command+parameters ALL REQUIRED
# (IssueCommandEndpoint.java:263-277 at core c09c61c).
#
# within: anchors — relink 120s (the usb-reenumeration-manual precedent for
# a physical re-seat class; a wall power-cycle rejoin lands well inside).
# Terminal 60s: the S31's measured confirmation window is ~5.369 s and the
# timeout event materializes at window close, but a mid-rejoin dispatch may
# queue behind the rejoin — decisive headroom, not tightness.

scenario: rejoin-race-operator
tier: OPERATOR
requires: [command-api]

preconditions:
  app: running                   # compose after a boot-health pass

stimulus:
  - operator:
      goal: "Put the S31 mid-rejoin, then race a command against it (the C2 class)"
      act: "FLIP OFF the S31's wall supply, wait ~5 s, FLIP ON, then IMMEDIATELY press ENTER (the command fires at ENTER — it must land while the rejoin is in flight), then HANDS OFF"
      note: "One act, one device. Do NOT restart the app; do NOT touch the dongle. The S31 carries no load — the relay click is the only local effect."
      confirm: enter
  - api:                         # fires immediately after ENTER — the racing
      method: POST               #   command, issued while the S31 rejoins
      path: "/api/v1/entities/${C.command.s31-entity}/commands"
      body:
        capability: on_off
        command: turn_on
        parameters: {}
      capture:
        name: race_command_id
        field: "data.commandId"

evidence:
  positive:
    - log: "zigbee.device_relinked"
      same_line: ["${C.command.s31-ieee}"]   # the S31's OWN relink — the
      within: 120s                           #   mid-rejoin premise, evidenced
    - api:                       # the honest-terminal assert: SOME terminal,
        path: "/api/v1/commands/${let.race_command_id}"
        assert:                  #   disposition deliberately open (header)
          field_equals:
            field: "data.terminal"
            value: true
      within: 60s
  forbidden:
    - log: "device_proposed"     # a re-propose is an identity regression —
    - log: "network_parameter_mismatch"      # the rep fails with the hit

verdict:
  pass: all positive within timeouts AND zero forbidden
  bundle: always
