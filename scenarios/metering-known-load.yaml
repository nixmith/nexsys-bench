      type: number
  # ---- CHAR-AFTER: the bracket's second half (typed at the close)
  - name: char_after_readings
    operator:
      goal: "CHAR-AFTER — the bracket's second half, so drift is a number (CHAR-1..3 against CHAR-BEFORE)"
      prompt: "Pass 1: wall → A → cord → B1 → LAMP — the tares (LAMP out 30 s: A and B1 on the CHAR sheet); LAMP in; two minutes; three A/B1 pairs. Pass 2: the same with B2. Then type how many pairs the sheet holds from BOTH halves of the bracket (CHAR-BEFORE + CHAR-AFTER; twelve if every reading was taken)."
