evidence:
  positive:
    # ---- G4-1 — tolerance ${C.metering.band_pct} (the Gen4 states no accuracy — the constants' band_pct); each rep a recorded RESULT
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.g4-1}/state"
        assert:
          field_within:
            field: "data.attributes.power_w.value"   # the wire pin CONFIRMED at T6, 2026-09-25 (the TR3 state read; v80 b4)
            reference: "${let.a_watts_g4_1_r1}"
            reference_subtract: "${let.tare_watts_g4_1}"    # A_W − TARE
            field_subtract: "${let.plug_offset_w_g4_1}"     # power_w − OFFSET
            tolerance_pct: "${C.metering.band_pct}"
            on_outside: record
      within: 10s
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.g4-1}/state"
        assert:
          field_within:
            field: "data.attributes.power_w.value"   # the wire pin CONFIRMED at T6, 2026-09-25 (the TR3 state read; v80 b4)
            reference: "${let.a_watts_g4_1_r2}"
            reference_subtract: "${let.tare_watts_g4_1}"    # A_W − TARE
            field_subtract: "${let.plug_offset_w_g4_1}"     # power_w − OFFSET
            tolerance_pct: "${C.metering.band_pct}"
            on_outside: record
      within: 10s
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.g4-1}/state"
        assert:
          field_within:
            field: "data.attributes.power_w.value"   # the wire pin CONFIRMED at T6, 2026-09-25 (the TR3 state read; v80 b4)
            reference: "${let.a_watts_g4_1_r3}"
            reference_subtract: "${let.tare_watts_g4_1}"    # A_W − TARE
            field_subtract: "${let.plug_offset_w_g4_1}"     # power_w − OFFSET
            tolerance_pct: "${C.metering.band_pct}"
            on_outside: record
      within: 10s
    # ---- TR3 — tolerance ${C.metering.band_pct_tr3} (the TR3's maker ±1 % is in its band — the constants' band_pct_tr3); each rep a recorded RESULT
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.tr3}/state"
        assert:
          field_within:
            field: "data.attributes.power_w.value"   # the wire pin CONFIRMED at T6, 2026-09-25 (the TR3 state read; v80 b4)
            reference: "${let.a_watts_tr3_r1}"
            reference_subtract: "${let.tare_watts_tr3}"    # A_W − TARE
            field_subtract: "${let.plug_offset_w_tr3}"     # power_w − OFFSET
            tolerance_pct: "${C.metering.band_pct_tr3}"
            on_outside: record
      within: 10s
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.tr3}/state"
        assert:
          field_within:
            field: "data.attributes.power_w.value"   # the wire pin CONFIRMED at T6, 2026-09-25 (the TR3 state read; v80 b4)
            reference: "${let.a_watts_tr3_r2}"
            reference_subtract: "${let.tare_watts_tr3}"    # A_W − TARE
            field_subtract: "${let.plug_offset_w_tr3}"     # power_w − OFFSET
            tolerance_pct: "${C.metering.band_pct_tr3}"
            on_outside: record
      within: 10s
    - api:
        path: "/api/v1/entities/${C.metering.plug-entity.tr3}/state"
