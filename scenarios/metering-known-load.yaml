# metering-known-load — THE MEASUREMENT RECORD's metering datum (rows
# CHAR-1..3 and REP-1): a metering plug's platform-reported power_w against
# reference meter A on a FRESH report, on a known load, the verdict claimed at
# the GUARANTEED band. OPERATOR tier — it needs hands and a keyboard, so it
# NEVER enters the nightly (`suite auto` refuses OPERATOR names; `suite all`
# defers them). Run it in tmux at an attended TTY (below). SKIPPED by
# construction until the hub's constants re-mint flips metering-plug.
#
# THE METHOD — verbatim from the BENCH-METER-1 charter §0 (hivemind
# context/instructions/2026-09-18_bench-lane_BENCH-METER-1_metering-known-
# load_field-within_link-quality-skeleton_charter.md):
#
# **The record this scenario encodes (the b2 audit §3; the plan §14;
# DEVICE-SET §2 `:49–:60`):** A = the P4460 (0.5 % typical / **2 % max** on
# power); B1, B2 = two no-spec generics of different brands; the load = two 40
# W appliance lamps (80 W, PF ≈ 1, 0.67 A); the plugs G4-1 · TR3 · G4-2.
# **CHAR** (replaces XCHK): A + B1 + B2 in series on the load, ~20
# simultaneous readings after thermal settle (≥ 5 min on), each B's OFFSET
# from A and SPREAD recorded; the dispute threshold for B is |offset| + 2 ×
# spread (k = 2, refutable at CHAR); whether B1's and B2's offsets are the
# SAME number is recorded (the shared-OEM tell); CHAR brackets each rep
# session (once before, once after). **The rep chain** is wall → A → PLUG →
# LAMP (ONE tare — the plug's own draw, read with the lamp unplugged: T1); B
# enters a rep only to attribute a dispute. **BAND** at the guaranteed figure:
# `|r − 1| ≤ 2.0 % + (0.5 × mult/div W) / (A_W − TARE) + 1.6 × ΔV/A_V + maker
# (TR3 1 %; Shelly 0)` — at 80 W and a divisor-1 plug that is 3.03 %; the
# typical-figure band (1.53 %) is RECORDED beside it, never the verdict's. The
# offsets are recorded and NEVER corrected for.
# METER-2 (2026-09-26): the prompts below are re-cut to the one-cord rig — one 40 W lamp (constants load_w 40, bands 3.65 / 3.53 at df4a2d7), two CHAR passes on one cord, three pairs per pass, two-minute settles, no dashboard toggle; the record above stands as the method's origin.
#
# HOW THE FORMAT CARRIES IT (BENCH-METER-1b — the record's method, format §5;
# hivemind context/instructions/2026-09-18_bench-lane_BENCH-METER-1b_
# subtract_on-outside_charter.md §3):
# - FRESHNESS IS THE OPERATOR'S. The engine reads the plug's /state within
#   10 s of ENTER and CANNOT know the value is fresh: the plug reports
#   ActivePower on a ≥ 1 W change or a 5–600 s window; the entity's timestamp
#   (data.lastReported) is entity-level — an energy report refreshes it too;
#   the TR3's power lags up to a minute. So EVERY REP BEGINS WITH A LOAD STEP
#   (the relay OFF ≥ 15 s then ON — or the LAMP out of the plug and back) and
#   a WAIT for the dashboard's power_w to show the lit value again, then ≥ 5 s
#   more; only then is A read and typed. The receipt records the entity's
#   timestamp beside read_at as a freshness WITNESS — recorded, never
#   asserted.
# - ONE DATUM PER REP, under on_outside: record. The first numeric power_w
#   read after ENTER decides and is never re-drawn. An OUTSIDE or VOID rep is
#   a RESULT: printed as read (the REP line at the keyboard), recorded in the
#   bundle, and the run CONTINUES to the next rep; the close FAILs, naming
#   every recorded rep by its let name. B attributes AFTER CHAR-AFTER — never
#   mid-run. VOID = an effective reference ≤ 0, or no numeric power_w within
#   10 s of ENTER.
# - THE RATIO IS THE RECORD'S DIV ROW: r = (power_w − OFFSET) / (A_W − TARE)
#   (DEVICE-SET §2 :54). OFFSET = the plug's own meter with no load —
#   field_subtract: ${let.plug_offset_w_<plug>}; TARE = the plug's own draw
#   as A sees it — reference_subtract: ${let.tare_watts_<plug>}. Two
#   subtractions, one per SIDE, exact in decimal. B's CHAR offsets are a THIRD
#   thing — recorded, never subtracted.
# - THE TARE BY DIFFERENCE. The plug's draw (≈ 0.5 W) sits below A's 0.2 A
#   spec floor, so it is measured at the lit load: W1 = A's watts with wall →
#   A → LAMP (no plug); W2 = A's watts with wall → A → PLUG → LAMP; TARE =
#   W2 − W1 (typed; a negative pair is typed as 0 and noted on the sheet).
# - RUN IT IN tmux AT AN ATTENDED TTY: `tmux new -s metering`, then
#   `~/nexsys-bench/tools/bench.sh scenario metering-known-load` — an SSH
#   drop must not kill a typed session (re-attach: `tmux attach -t
#   metering`).
# - THE RECEIPT. Every typed value (text, refused entries, instant) and every
#   read (field, value, field_subtract, value_effective, reference and its
#   let, reference_subtract, reference_effective, ratio, deviation_pct,
#   tolerance_pct, verdict, read_at, witness_key + witness) lands in the
#   bundle: resolved.json `let` + api-captures.json.
# - WIRE PIN CONFIRMED at T6 (2026-09-25; v80 b4; was PENDING): power_w's /state key — data.attributes.power_w.value
#   (the live /state dialect; the attribute is power_w on
#   StandardCapabilities.powerMeter(), :481–:483 at core d1c2cbc) — and the
#   witness key data.lastReported (WCAP capture 5) are re-pinned by the first
#   rep's read (format law #20).
# - Entities: ${C.metering.plug-entity.<plug>} (minted at the first
#   adoption). Bands: band_pct 3.03 (the Gen4s) · band_pct_tr3 4.03 (the
#   TR3's maker ±1 % added).
# METER-2 (2026-09-26): the bands named above are the 80 W record's; at df4a2d7 the constants carry band_pct 3.65 · band_pct_tr3 3.53 for the one 40 W lamp (T4b), and the prompts below read them as ${C.metering.band_pct} / ${C.metering.band_pct_tr3}, never as literals.

scenario: metering-known-load
tier: OPERATOR
requires: [metering-plug, command-api]

preconditions:
  app: running

stimulus:
  - operator:
      goal: "CHAR-BEFORE — characterise B1 and B2 against A (THE MEASUREMENT RECORD rows CHAR-1..3)"
      act: "Pass 1: chain wall → A → cord → B1 → LAMP (A and B1 in series; no plug). Tares: LAMP out of B1 for 30 s, then write A and B1 on the CHAR sheet. LAMP in; two minutes; then three simultaneous readings of A and B1, written as pairs. Pass 2: the same chain with B2 in B1's place — the tares, two minutes, three A/B2 pairs. Re-chain wall → A → cord → LAMP (no meter, no plug) and press ENTER."
      note: "CHAR-1 = B1's OFFSET from A and its SPREAD; CHAR-2 = B2's; CHAR-3 = whether B1's and B2's offsets are the SAME number (the shared-OEM tell). B's dispute threshold = |offset| + k × spread, k = ${C.metering.k_spread}. The load is ${C.metering.load_w} W (one 40 W lamp). Offsets are recorded and NEVER corrected for."
      confirm: enter

# The operator's script, in order (format §5: typed at ENTER when a line
# first reads it, every earlier entry first; unread entries at the close).
# Per plug: TARE (by difference) · OFFSET (no load) · A's volts ×2 · REP ×3,
# each rep behind ITS OWN LOAD STEP; CHAR-AFTER last. 22 typed entries.
let:
  # ---- G4-1: TARE, OFFSET, volts ×2, then REP ×3 (a LOAD STEP each)
  - name: tare_watts_g4_1
    operator:
      goal: "T1 for G4-1 — the TARE: G4-1's own draw as A sees it, by difference (the record's A_W − TARE; reference_subtract)"
      prompt: "Chain wall → A → cord → LAMP (no plug). After 30 s read A's watts → W1, on the sheet. Move G4-1 from its wall socket into the cord's end and the LAMP into G4-1: wall → A → cord → G4-1 → LAMP. Read G4-1's relay at the api in the meter-reader window; if OFF, press its button and read again until `on: true`. Wait 30 s, read A → W2. Type W2 − W1 (G4-1's own draw as A sees it; if negative, type 0 and note the pair on the sheet)."
      note: "Rep sheet: W1, W2 and TARE for G4-1. B1 and B2 stay OUT of the chain from here; nothing above A switches."
      type: number
      min: 0
  - name: plug_offset_w_g4_1
    operator:
      goal: "OFFSET for G4-1 — the plug's own meter with no load (DEVICE-SET's OFFSET; the record's power_w − OFFSET; field_subtract)"
      prompt: "LAMP out of G4-1, relay ON (as read at the api). Wait until `power_w` for G4-1 settles in the meter-reader window (the TR3 up to a minute); type it (DEVICE-SET's OFFSET — expect 0.0). Then LAMP back into G4-1."
      note: "Rep sheet: OFFSET for G4-1. B's CHAR offsets are a third thing — never subtracted."
      type: number
      min: 0
  - name: a_volts_g4_1_1
    operator:
      goal: "A's volts for G4-1, first reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts now"
      note: "Recorded in the bundle; 1.6 × ΔV/A_V is computed on the sheet."
      type: number
  - name: a_volts_g4_1_2
    operator:
      goal: "A's volts for G4-1, second reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts again, 10 s later"
      note: "Recorded in the bundle; ΔV = |the two readings' difference|."
      type: number
  - name: a_watts_g4_1_r1
    operator:
      goal: "REP 1/3 on G4-1 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the Gen4 states no accuracy — band ${C.metering.band_pct} %)"
      prompt: "THE LOAD STEP: LAMP out of G4-1 for at least 15 s, then back in. WAIT until `power_w` for G4-1 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 1/3 on G4-1 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  - name: a_watts_g4_1_r2
    operator:
      goal: "REP 2/3 on G4-1 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the Gen4 states no accuracy — band ${C.metering.band_pct} %)"
      prompt: "THE LOAD STEP: LAMP out of G4-1 for at least 15 s, then back in. WAIT until `power_w` for G4-1 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 2/3 on G4-1 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  - name: a_watts_g4_1_r3
    operator:
      goal: "REP 3/3 on G4-1 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the Gen4 states no accuracy — band ${C.metering.band_pct} %)"
      prompt: "THE LOAD STEP: LAMP out of G4-1 for at least 15 s, then back in. WAIT until `power_w` for G4-1 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 3/3 on G4-1 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  # ---- TR3: TARE, OFFSET, volts ×2, then REP ×3 (a LOAD STEP each)
  - name: tare_watts_tr3
    operator:
      goal: "T1 for TR3 — the TARE: TR3's own draw as A sees it, by difference (the record's A_W − TARE; reference_subtract)"
      prompt: "Chain wall → A → cord → LAMP (no plug). After 30 s read A's watts → W1, on the sheet. Move TR3 from its wall socket into the cord's end and the LAMP into TR3: wall → A → cord → TR3 → LAMP. Read TR3's relay at the api in the meter-reader window; if OFF, press its button and read again until `on: true`. Wait 30 s, read A → W2. Type W2 − W1 (TR3's own draw as A sees it; if negative, type 0 and note the pair on the sheet)."
      note: "Rep sheet: W1, W2 and TARE for TR3. B1 and B2 stay OUT of the chain from here; nothing above A switches."
      type: number
      min: 0
  - name: plug_offset_w_tr3
    operator:
      goal: "OFFSET for TR3 — the plug's own meter with no load (DEVICE-SET's OFFSET; the record's power_w − OFFSET; field_subtract)"
      prompt: "LAMP out of TR3, relay ON (as read at the api). Wait until `power_w` for TR3 settles in the meter-reader window (the TR3 up to a minute); type it (DEVICE-SET's OFFSET — expect 0.0). Then LAMP back into TR3."
      note: "Rep sheet: OFFSET for TR3. B's CHAR offsets are a third thing — never subtracted."
      type: number
      min: 0
  - name: a_volts_tr3_1
    operator:
      goal: "A's volts for TR3, first reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts now"
      note: "Recorded in the bundle; 1.6 × ΔV/A_V is computed on the sheet."
      type: number
  - name: a_volts_tr3_2
    operator:
      goal: "A's volts for TR3, second reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts again, 10 s later"
      note: "Recorded in the bundle; ΔV = |the two readings' difference|."
      type: number
  - name: a_watts_tr3_r1
    operator:
      goal: "REP 1/3 on TR3 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the TR3's maker ±1 % is in its band — ${C.metering.band_pct_tr3} %)"
      prompt: "THE LOAD STEP: LAMP out of TR3 for at least 15 s, then back in. WAIT until `power_w` for TR3 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 1/3 on TR3 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  - name: a_watts_tr3_r2
    operator:
      goal: "REP 2/3 on TR3 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the TR3's maker ±1 % is in its band — ${C.metering.band_pct_tr3} %)"
      prompt: "THE LOAD STEP: LAMP out of TR3 for at least 15 s, then back in. WAIT until `power_w` for TR3 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 2/3 on TR3 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  - name: a_watts_tr3_r3
    operator:
      goal: "REP 3/3 on TR3 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the TR3's maker ±1 % is in its band — ${C.metering.band_pct_tr3} %)"
      prompt: "THE LOAD STEP: LAMP out of TR3 for at least 15 s, then back in. WAIT until `power_w` for TR3 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 3/3 on TR3 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
      type: number
  # ---- G4-2: TARE, OFFSET, volts ×2, then REP ×3 (a LOAD STEP each)
  - name: tare_watts_g4_2
    operator:
      goal: "T1 for G4-2 — the TARE: G4-2's own draw as A sees it, by difference (the record's A_W − TARE; reference_subtract)"
      prompt: "Chain wall → A → cord → LAMP (no plug). After 30 s read A's watts → W1, on the sheet. Move G4-2 from its wall socket into the cord's end and the LAMP into G4-2: wall → A → cord → G4-2 → LAMP. Read G4-2's relay at the api in the meter-reader window; if OFF, press its button and read again until `on: true`. Wait 30 s, read A → W2. Type W2 − W1 (G4-2's own draw as A sees it; if negative, type 0 and note the pair on the sheet)."
      note: "Rep sheet: W1, W2 and TARE for G4-2. B1 and B2 stay OUT of the chain from here; nothing above A switches."
      type: number
      min: 0
  - name: plug_offset_w_g4_2
    operator:
      goal: "OFFSET for G4-2 — the plug's own meter with no load (DEVICE-SET's OFFSET; the record's power_w − OFFSET; field_subtract)"
      prompt: "LAMP out of G4-2, relay ON (as read at the api). Wait until `power_w` for G4-2 settles in the meter-reader window (the TR3 up to a minute); type it (DEVICE-SET's OFFSET — expect 0.0). Then LAMP back into G4-2."
      note: "Rep sheet: OFFSET for G4-2. B's CHAR offsets are a third thing — never subtracted."
      type: number
      min: 0
  - name: a_volts_g4_2_1
    operator:
      goal: "A's volts for G4-2, first reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts now"
      note: "Recorded in the bundle; 1.6 × ΔV/A_V is computed on the sheet."
      type: number
  - name: a_volts_g4_2_2
    operator:
      goal: "A's volts for G4-2, second reading — the band's ΔV term (recorded, never the verdict's)"
      prompt: "A's volts again, 10 s later"
      note: "Recorded in the bundle; ΔV = |the two readings' difference|."
      type: number
  - name: a_watts_g4_2_r1
    operator:
      goal: "REP 1/3 on G4-2 — the datum: A and the platform's power_w on a FRESH report (REP-1's row; the Gen4 states no accuracy — band ${C.metering.band_pct} %)"
      prompt: "THE LOAD STEP: LAMP out of G4-2 for at least 15 s, then back in. WAIT until `power_w` for G4-2 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
