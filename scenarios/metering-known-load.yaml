      prompt: "THE LOAD STEP: LAMP out of G4-2 for at least 15 s, then back in. WAIT until `power_w` for G4-2 in the meter-reader window shows the lit value again (the TR3 up to a minute), then 5 s more. Read A's watts, type, ENTER — the platform's read follows within 10 s."
      note: "REP 2/3 on G4-2 — the datum. WITHIN/OUTSIDE/VOID prints at once; an OUTSIDE or VOID rep is recorded and the run continues — attribute with B after CHAR-AFTER. Rep sheet: A_W and the meter-reader window's power_w."
