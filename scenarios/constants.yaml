# rule 1 + §5: additive-only, further changes STOP-gated), so the `harness:`
# stimulus key is a FOLD PLAN in docs/2026-09-13_P-1_power-harness_design.md,
# not an edit here.
#
# ⚠ NAMESPACE: this is `harness.plugs` (a LIST of rows), NOT the pre-existing
# top-level `plugs:` at :336 (a MAP keyed by name, carrying the `plug:`
# stimulus's hue-wall ip). Two different collections, two different shapes,
# one file — read the path, not the leaf name.
#
# ⚠ ROLE IS `harness-candidate`, DELIBERATELY. harness.py REFUSES a candidate
# in live mode and plans only in --dry-run. Promotion to `role: harness` is
# Nick's operator act (`HARNESS-PLUG: <entity>`) and it asserts BOTH halves:
# (a) the plug is dedicated to harnessing — never also the DUT in a leg, and
# (b) the rating below was read off the unit's own molded label.
# P-1 could not promote it: the bench's only commandable plug is the S31 and
# s31/nightly are HANDS OFF until R-5.
harness:
  plugs:
    # The S31 Lite ZB — the same ULID as command.s31-entity (:115) and the
    # remembered-ulids row (:67). It is the bench's ONLY commandable plug,
    # which is exactly why it cannot be the dedicated harness yet: it is the
    # CONFIRMED-class leg's own target (B2 §5.2). See the design doc's
    # shopping line — a second plug is what makes this a real instrument.
    - entity: "01KXW1W1SBJZERC9MBAMV2DWKE"
      role: harness-candidate
      # ⚠ PROVISIONAL — 15 A / 1800 W at 120 V is the vendor + ETL-listed
      # retail figure for the SONOFF S31 Lite ZB US (itead.cc product page;
      # Amazon B082PSKRSP "S31 Lite 15A Outlet"; read 2026-09-13). NOT read
      # off a datasheet in hand and NOT off the unit's label — the repo
      # carries no S31 corpus entry (corpus/devices/ holds the Hue A19 and
      # the SNZB-03P only). The `harness-candidate` role is what keeps this
      # number out of a live decision; promoting the role is the act that
      # verifies it. harness.py's `load-rating` guard refuses a live run on
      # an absent or non-positive rating.
      rating_w: 1800
      # The safety budget, enforced in code and not in a runbook (R-4b §9
      # P-1, "per-profile safety limits, enforced in code"). Counted per
      # --window in ~/hs-bench/harness/<plug>.json; a --dry-run never
      # writes the ledger.
      maxCyclesPerWindow: 2
      minSecondsBetweenCycles: 60
      # SD-A4 (DP-2 taken: the bound lives HERE, in the plug's row, not as a
      # CLI flag — a safety limit a caller could widen from the command line
      # is not a limit; a flip is a constants re-mint, never a code edit, the
      # same doctrine `capabilities:` already follows). A cycle whose `at:`
      # offset falls outside this many seconds from window-open is REFUSED.
      # ⚠ PROVISIONAL: 300 s bounds the longest act the format can express
      # today with room to spare — the design §4 example is at=36s off_for=5s
      # and the harness's own confirm poll is 20 s (DEFAULT_CONFIRM_TIMEOUT),
      # so a worst case sits near 61 s. It is a CEILING chosen to refuse
      # absurdity (a mis-typed `at: 3600s`), not a measured envelope; re-mint
      # it against a real rehearsal window when HARNESS-PLUG: promotes the
      # plug. Omit the key entirely and the guard reports `absent
      # (UNBOUNDED)` — it never invents a bound nobody minted.
      windowSeconds: 300
  dut_profiles:
    # The hazard the safety table exists for: the Hue LCA017's factory reset
    # is a rapid 6x power dance, so a harness that can cycle power is a
    # harness that can silently factory-reset an expensive bulb. harness.py
    # refuses at the resetCycles-1 threshold (5) — it never reaches 6.
    # The lamp rode the S31 relay once already (the power-topology finding,
    # :42-50); HUE-RESET is wall power, never the harness.
    - profile: philips_hue_white_color_a19
      powerCycleHazard: factory-reset
      resetCycles: 6

# ---------------------------------------------------------------------------
# ULID PROVENANCE + THE FLEET (R-5 SD-A6 / SD-A7, 2026-09-13).
#
# WHY THIS BLOCK EXISTS. F-R4-2, made precise by R-4c: one physical SNZB-02P
# carries deviceId `01KXW0156Z…` on the bench card and `01M2DKJWVD…` on the
# held card. A device ULID is therefore NOT stable across cards, and any
# constant this file persists is valid only while the card that minted it is
# in the slot. Asserting a bench-card ULID against a held-card registry does
# not FAIL loudly — it reads as an absent row, which is exactly the quiet
# wrong answer the doctrine bars.
#
# WHY THE CARD IS NAMED BY LABEL, NOT EUI64. SD-A6's own wording says
# `# minted-by: bench-card <EUI64>` and expects the registry's device list to
# carry the EUI64. Neither half holds at this bench: (a) the frozen v1.1 read
# surface has NO device list and NO EUI64 field anywhere — it is health ·
# entities · commands · runs · automations, and an entity row carries
# entityId + deviceId, both ULIDs; and (b) an EUI64 could not decide the
# question anyway, because the coordinator dongle is CARD-INVARIANT: R-4c
# proved `stableId=…0ae2dd7cecf8ef11b80168135c2a50c9…` byte-identical across
# two sessions and four card swaps, one physical radio never unseated. The
# EUI64 is a property of the silicon, and the silicon is what the two cards
# SHARE — so it is identical on both and discriminates nothing. What differs
# per card is the id SET the card itself reports, and that is readable.
#
# THE CHECK. tools/runner/engine.py reads /api/v1/entities once per scenario
# run and REFUSES when a ULID declared here is absent from the card's own
# read, naming the declared card. A read that did not happen decides nothing
# (it is noted, never a refusal): a transient API blip must not re-grade a
# floor, and a foreign card answers its API perfectly well — so the refusal
# arm needs a successful read, and only a successful read can arm it.
provenance:
  # The card these ULIDs were minted on. Bench card `hs-dev-1` (the nightly's
  # card); the held card is `hs-fresh` (R-4c operator record §0).
  card: "hs-dev-1"
  ulids:
    # minted-by: bench-card hs-dev-1
    - path: command.s31-entity
      ulid: "01KXW1W1SBJZERC9MBAMV2DWKE"
