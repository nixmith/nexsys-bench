# ---------------------------------------------------------------------------
# Command-lifecycle vocabulary — RE-PINNED AT SOURCE at the B2 desk-stage
# re-mint 2026-07-28 (B2 §4.1.1; enumerate-at-source): every value below
# read from the LIVE endpoint code at core `c09c61c` api/rest-api. The
# B1-era PROVISIONAL guesses HELD — zero value changes. The casing caveat
# RESOLVED: the command endpoints hand-build camelCase {data,meta}
# (IssueCommandEndpoint.java:364-378; GetCommandStatusEndpoint.java:189-206)
# and phases ride the UPPERCASE enum name (currentPhase.name(),
# GetCommandStatusEndpoint.java:197).
#   phases:          CommandLifecyclePhase.java:36-84 (:45/:54/:64/:73/:83)
#   terminal-field:  data.terminal      — GetCommandStatusEndpoint.java:198
#   phase-field:     data.currentPhase  — GetCommandStatusEndpoint.java:197
#   commandId capture (202 body): data.commandId — IssueCommandEndpoint
#                    .java:365 (respondAccepted)
#   POST body:       capability + command + parameters ALL REQUIRED
#                    (parameters {} for parameterless) —
#                    IssueCommandEndpoint.java:263-277
#   superseded:      a non-"acknowledged" command_result renders terminal
#                    at ACKNOWLEDGED with lifecycle.ACKNOWLEDGED.details
#                    .result carrying the outcome (GetCommandStatusEndpoint
#                    .java:150-158; OUTCOME_SUPERSEDED "superseded" =
#                    StandardPendingCommandLedger.java:153)
command-lifecycle:
  phases: [ACCEPTED, DISPATCHED, ACKNOWLEDGED, CONFIRMED,
           CONFIRMATION_TIMED_OUT]
  confirmed-class: "CONFIRMED"
  timed-out-class: "CONFIRMATION_TIMED_OUT"
  # The status-read wire paths the engine's phase_terminal assert binds —
  # re-pinned at source (above), a constants re-mint, never a code edit.
  terminal-field: "data.terminal"
  phase-field: "data.currentPhase"

# The frozen runs-surface action-outcome vocabulary (LIVE today).
# Source: core 1aa809d RunExplanation.java:227-233 (ActionOutcome), wire
# token = the enum name (GetRunCausalChainEndpoint:164); spot-checked at
# source 2026-07-12.
runs-outcomes: [DISPATCHED, CONFIRMED, UNCONFIRMED, FAILED, SKIPPED]

