# ---------------------------------------------------------------------------
# THE AUTO SUITE OF RECORD (B2 §7.3 — the H2/B3 suite definition; the
# nightly runs exactly this list, OPERATOR scenarios deliberately absent:
# headless print_operator_block opens the window with no hands present,
# the C-1 lesson). AMENDED to NINE legs by Nick's 2026-07-30 split-settle
# ruling. RE-AMENDED 2026-07-31 by Nick's F1 ruling — the split-settle
# ORDER of 2026-07-30 is SUPERSEDED; the order is still the fix, but the
# settle moves to the END and becomes THE PARK:
#   bench.sh suite boot-health,command-confirm,command-timeout-absent,\
#     command-supersession,command-identify-honest,usb-reenumeration,\
#     timeout-honesty-no-change,command-confirm-s31,command-s31-settle
#
# RE-AMENDED 2026-08-04 (Nick's suite-position ruling): command-confirm-s31
# moves 3rd -> 8th, immediately before the park — the suite line above
# quotes THIS ruling's order. A precondition amendment in the F1 lineage,
# never a retune: the WINDOW, the SCENARIOS, and the park-LAST law are all
# UNCHANGED. MEASURED BASIS (the Aug-2/3/4 nightly FAILs, adjudicated
# instrument-first): at position 3 the leg fired inside the nightly's
# three-boot choreography (quiesced boot -> SIGTERM -> suite boot ->
# restored boot) ~12 s into the SUITE boot — the asserted turn_on entered
# a mesh up for only 0.772 s (network_resumed 04:30:51.004 -> ACCEPTED
# 04:30:51.776, the Aug-3 suite-boot log) on a coordinator cut mid-close
# seconds earlier, and TIMED_OUT three park-verified nights running. The
# SAME device's settle off-edge CONFIRMED at 143 ms and 3.59 s in the
# +40-55 s post-resume band — on two of those nights ~10 s after the usb
# leg's deliberate dongle power-cycle recovery — so position-8 physics
# are proven under the harshest in-suite condition. The boot-adjacent
# window is hostile end-to-end: nights 2-3 edge-proven (coincidence
# ~1e-5 against the measured ~1-report/5-min cadence), night-4 NO
# reported edge — position 8 exits the window for BOTH observed failure
# shapes. Settle adjacency is priced: if the confirm's ON lands, the
# park's own off-edge may be clock-held and read TIMED_OUT while the
# relay physically parks — lawful; the park's terminal assert is
# disposition-agnostic (the settle header's own contract). The MARGIN
# WATCH and the pre-ruled HUE-RESET contingency below REMAIN IN FORCE —
# the Hue re-power is an H3 physical act, complementary to this
# amendment, not superseded by it. Adjudications of record, by path
# (nexsys-hivemind/context/audits/):
#   2026-08-03_B3_night3_command-confirm-s31_clean-park-FAIL_evidence-read.md
#   2026-08-04_B3_night3_blockR-adjudication_v45-beat-3.md
#   2026-08-04_B3_night3_R8-R9-addendum_and_night4-baseline.md
#   2026-08-04_B3_night4_blockV-adjudication_no-edge-verdict.md (the
#     night-4 verdict revision: the ruled fix STRENGTHENED — it cures
#     both observed failure shapes)
#
# WHY command-s31-settle IS NOW LAST (it is THE PARK, not a settle).
# MEASURED 2026-07-31 (Blocks C/D/E, the F-12 adjudication): the S31's
# on/off attribute reporting is UNVERIFIED at source —
#   zigbee.reporting_configured: device=0x00124B002FA8D1C5 clusters=1
#     verified=0 degraded=1
#   zigbee.confirmation_downgraded: ... capability=on_off cluster=0x6
#     posture=VERIFIED_REPORTS/SLEEPY outcome=best_effort
# so what reaches us is the device's NATIVE unsolicited-report cadence,
# never a configured one. Its clock STARTS ON A REPORT, never on a command
# — the correction that reconciles every filed datum: S-1's 111 ms
# CONFIRMED after a no-edge gap · the 11.613 s report in Block D · Rep A
# CONFIRMED after 60 s quiet · Rep B TIMED_OUT one second after a fresh
# report. Bracket: a report-to-edge gap of 16 s is insufficient and 60 s is
# sufficient; the interval itself is UNMEASURED and deliberately NOT relied
# upon by this design.
#
# THE MECHANISM (no timing constant anywhere): the park's turn_off leaves
# the relay OFF at suite end; ~22 h of overnight clears the report clock by
# any plausible margin; the next night's command-confirm-s31 fires a real
# ON-edge against an IDLE clock and confirms in the S-1-rep-1 class. The
# park's own OFF report may itself be clock-held — irrelevant: nothing
# asserts it, the relay actuates regardless, and the existing
# disposition-agnostic terminal assert (data.terminal == true) is satisfied
# by either disposition. Dependency, verified in-band at the landing:
# bench-hero commands ONLY the Hue — zero S31 references in the live config.
#
# SAME-DAY RE-RUN TRAP: this design assumes ~one run per clock-clearing
# period. Running the suite twice in one evening fires command-confirm-s31
# minutes after the previous run's park, against a clock that has not
# cleared — an expected red that is NOT a regression. To re-run by hand:
# park manually, wait >= 2 min, then run the suite.
#
# MARGIN WATCH (named now so a future red is triage-free): the no-clock
# ON-report latency is observed at 111 ms (S-1) and between 3.8 s and 5.0 s
# (Rep A, polling-granular), n=2, against a 5.369 s confirmation window. A
# red on this leg WITH the park verified is NOT a flake — it is the
# best_effort posture expressing itself, the native cadence brushing the
# window. It trips the pre-ruled HUE-RESET contingency, never a retry.
# B3's nightly digest records this latency so the distribution builds.
#
# Expected shape while HUE-RESET is pending: command-confirm SKIPPED-honest
# on [hue-online]; every other verdict decisive.
# NIGHT-1 BOOTSTRAP: run the park once by hand at the B3 landing so the
# first nightly starts parked.

# The DATA key the block above is the rationale for (B3 DP-1): `bench.sh
# suite auto` resolves EXACTLY this list, in EXACTLY this order — the
# runner never sorts, so resolved order == key order by construction, and
# the park-LAST law rides the order. OPERATOR-tier names are UNLAWFUL here
# (`suite auto` structurally REFUSES them pre-flight — the C-1 headless-
# window hazard); lexical `suite all` is UNLAWFUL for the nightly for the
# same two reasons (lexical order breaks park-LAST AND drags
# usb-reenumeration-manual into an unattended run). Consumers: `suite auto`
# (reads this key) · the runner README (cites by pointer, never copies) ·
# the H2 ledger cell (definition of record). The nightly wrapper NEVER
# carries the list.
auto-suite:
  - boot-health
  - command-confirm
  - command-timeout-absent
  - command-supersession
  - command-identify-honest
  - usb-reenumeration
  - timeout-honesty-no-change
  - command-confirm-s31         # 8th — the 2026-08-04 suite-position ruling
  - command-s31-settle          # THE PARK — LAST (the F1 re-amendment above)

# ---------------------------------------------------------------------------
# B3 NIGHTLY QUIESCENCE + WRAPPER CONFIG (DP-2/DP-3) — consumed by
# tools/nightly.sh through `nightly_digest.py config-env`. Every
# "PLACEHOLDER" below is a ⛔PIN slot: minted at the Pi-stage re-mint FROM
# THE P-BLOCK PASTES (the constants law: minted from the instrument, never
# from a report — the B2 two-stage precedent). The wrapper REFUSES to run
# while any required value is a PLACEHOLDER: an unconfigured install must
# never half-run, and a refused night writes NO digest line (a missing
# line by morning is itself the red — runner README, the nightly section).
quiesce:
  # ⛔PIN-1 discriminates the branch: A = bench-hero lives in its OWN file
  # (quiesce = mv the file to hold-dir); B = bench-hero is a section of a
  # single config file (quiesce = swap in the GENERATED hero-less variant,
  # guarded by the live-basis cmp — drift ⇒ run UN-quiesced and flag
  # UNQUIESCED(CONFIG-DRIFT) in the digest; never overwrite Nick's edits).
  # MINTED 2026-07-31 from the P-1 (quiesce, 2026-07) paste: bench-hero
  # lives in the SHARED main config (~/hs-bench/config/homesynapse.yaml, 1208 B, sections=3)
  # — no dedicated file => Branch B (generated-variant swap + cmp guard).
  branch: "B"
  # ⛔PIN-1: the config file that carries bench-hero (full Pi path, from
  # the P-1 grep of ~/hs-bench/config/).
  carrier: "~/hs-bench/config/homesynapse.yaml"
  # Where the quiesced carrier (A) / the night-held live copy (B) rests
  # during the run. Same filesystem as the carrier — mv stays atomic.
  hold-dir: "~/hs-bench/quiesce-hold"
  # Branch B ONLY (stay PLACEHOLDER on branch A): the generated hero-less
  # variant + the byte-copy of the live config it was derived from.
  # Regenerated by the OPERATOR whenever the live config changes — the
  # wrapper never performs YAML surgery.
  heroless-variant: "~/hs-bench/quiesce-hold/homesynapse.heroless.yaml"
  live-basis: "~/hs-bench/quiesce-hold/homesynapse.live-basis.yaml"
  # ⛔PIN-2: the automations-list instrument for the quiesce ABSENT /
  # restore PRESENT asserts. Desk PROVISIONAL from core c09c61c source —
  # GET /api/v1/automations (RestFilters.java:308), rows carry data[].name
  # (ListAutomationsEndpoint.java:106-108) — but the P-2 paste is the
  # measurement of record: re-mint from the paste, never from this
  # citation.
  # MINTED 2026-07-31 from the P-2 paste: GET /api/v1/automations -> 200,
  # data[] envelope, name field, served name exactly "bench-hero"
  # (the automationId ROTATES per boot — the name is the stable token).
  automations-route: "/api/v1/automations"
  # ⛔PIN-2: the exact substring of the live list body that proves
  # bench-hero presence (its served name, from the P-2 paste). Fixed-string
  # grep semantics — pick a token with no quoting traps.
  # The grep -F token (quotes included — matches the served JSON name
  # value and nothing else in the body).
  hero-name-token: '"bench-hero"'
nightly:
  # DP-5 REC values (not pins; ⛔PIN-3 discriminates the SCHEDULER branch,
  # not these). suite-timeout: the 9 legs run ~6–10 min on record — 45m is
  # the generous runaway ceiling (instruction REC).
  suite-timeout: "45m"
  logs-dir: "~/hs-bench/nightly-logs"
  digests-dir: "~/hs-bench/digests"

