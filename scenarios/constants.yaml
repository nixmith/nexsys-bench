# ---------------------------------------------------------------------------
# METERING — the known-load datum (BENCH-METER-1, 2026-09-18). Consumer:
# scenarios/metering-known-load.yaml (THE MEASUREMENT RECORD rows CHAR-1..3
# and REP-1). Source of every value: the BENCH-METER-1 charter §0/§3 (hivemind
# context/instructions/2026-09-18_bench-lane_BENCH-METER-1_metering-known-
# load_field-within_link-quality-skeleton_charter.md); the band arithmetic is
# the v76-b2 audit §3's (context/audits/2026-09-17_v76-b2_nick-brief_hardware-
# calendar_attack_audit.md). Re-minted by the hub FROM THE INSTRUMENT at the
# first adoption — never from a report.
metering:
  # The plugs' entity ULIDs — UNSET until the first adoption (Thu 09-24),
  # then minted from that adoption's own /api/v1/entities read and declared
  # in provenance: below (SD-A6). ONE KEY, THREE PLUGS: the scenario reads
  # G4-1 · TR3 · G4-2 in turn, three reps each — one entity would read one
  # plug nine times. The placeholders are URL-SAFE on purpose: a run before
  # the mint fails HONESTLY at the api read (a non-200 read → expected-not-
  # seen, the read quoted). A space or a non-ASCII character in the path raises
  # http.client.InvalidURL out of drivers.api_request (it catches URLError/
  # OSError/TimeoutError only) — a "runner internal error", not an honest
  # FAIL (measured 2026-09-18 on "<UNSET — minted at the first adoption, Thu
  # 09-24>", the network stubbed).
  # MINTED at THE THURSDAY ORDER (run Fri 2026-09-25) from T3b's own /api/v1/entities read
  # (entities-post.json; the deviceIds from each plug's zigbee.device_adopted line; the
  # labels from labels.txt). The divisors READ at adoption (zigbee.metering_formatting_read):
  # G4-1 · G4-2 0x0B04 mult=1 div=1 (power 1 W; voltage 1/100; current 1/1000), 0x0702
  # div=1000000; TR3 0x0B04 div=10 (power 0.1 W), 0x0702 div=1000. The band below assumed
  # divisor 1 for the Gen4 — as read; the TR3's finer step is inside its band. (v80 b3, T4)
  plug-entity:
    g4-1: "01M3DPGF6Y4YXNXDHBW38ZEX2G"
    tr3: "01M3DM74SGEY7RXVDYSM4PK2XA"
    g4-2: "01M3DPKN9WD9B88Q4SVDMSBJVS"
  # THE VERDICT'S BAND — the GUARANTEED figure: the P4460's power spec is
  # 0.5 % typical / 2 % MAX, and a class is a maximum. BAND = 2.0 % +
  # (0.5 × mult/div W)/(A_W − TARE) + 1.6 × ΔV/A_V + maker = 2.00 + 0.625
  # (0.5 W / 80 W — a divisor-1 plug, the widest quantization; the divisor
  # is READ at the first adoption, measurement-record rows G4-1/G4-2) + 0.40
  # (1.6 × 0.3 V / 120 V) + 0 (Shelly states no accuracy) = 3.025, carried
  # as 3.03 (the b2 audit's figure; 2.0 + 0.63 + 0.40). THE TYPICAL-FIGURE
  # BAND, recorded beside it and NEVER the verdict's: 0.5 + 0.625 + 0.40 =
  # 1.53 % (the likely band).
  # RE-DERIVED AT 40 W for the sitting of 2026-09-25 (T4b, v80 b4): the rig has ONE separator
  # cord and no strip, so the load is ONE 40 W lamp and the CHAR chain runs as two passes
  # (wall → A → cord → B1 → LAMP, then → B2 → LAMP; the REP chain wall → A → cord → PLUG → LAMP).
  # Gen4 (divisor 1, READ at adoption): 2.00 + (0.5 W / 40 W = 1.25) + 0.40 + 0 = 3.65. The 80 W
  # figure (3.03) returns with the strip at the next sitting.
  band_pct: 3.65
  # The TR3 adds its maker's stated ±1 % (DEVICE-SET :55): 3.03 + 1.0. Its
  # typical-figure band beside it, never the verdict's: 2.53 %.
  # TR3 at 40 W with its divisor 10 (0.05 W step) READ at adoption: 2.00 + (0.025 W / 40 W = 0.06)
  # + 0.40 + 1.0 (the maker's ±1 %) = 3.46, carried as 3.53 with the 0.5-mult/div convention at
  # 40 W (0.05 W / 40 W = 0.125): the wider of the two forms is the verdict's. (T4b)
  band_pct_tr3: 3.53
  load_w: 40          # ONE 40 W appliance lamp tonight (T4b; the pair returns with the strip) — PF ≈ 1, 0.33 A
  k_spread: 2         # CHAR's dispute threshold for B: |offset| + 2 × spread
  # METER-3 (2026-09-27; D-v81-17; hivemind context/instructions/2026-09-27_bench-lane_METER-3_
  # freshness-VOID_per-plug-step_CHAR-typed_charter.md §1.2–§1.3) — THREE per-plug maps MINTED
  # FROM THE CHAR BUNDLE `metering-known-load-20260926T225552Z` (Sat 2026-09-26; hivemind
  # context/audits/2026-09-26_CHAR-sitting_capture/api-captures.json — the nine reads' read_at,
  # witness = data.lastReported, and bodies) as the v81-b4 intake audit read them (context/
  # audits/2026-09-26_v81-b4_CHAR-bundle_intake_two-layer-audit.md §1–§3). The numbers below
  # are COPIED from the charter's mint, never re-derived in this file (a re-mint's numbers are
  # the record's). Machine-readable rows: `provenance.metering` at the foot of this file.
  #
  # fresh-within-s — the runner's freshness window per plug (engine `field_within.fresh_within_s`):
  # a REP whose witness is older than this at the read is VOID — its ratio RECORDED, its verdict
  # void (the b7 audit's "recorded, never asserted" retired). Gen4: reported every ≈ 5 s under
  # load (the store: state_reported every 5 s, 22:33:02 → 22:34:31Z; reporting_configured …
  # clusters=3 verified=3 at adoption, ActivePower min 5 s) → 6× = 30. TR3: reports 87–165 s
  # apart under load, ≈ 66 s at idle (the b5 audit §1) → 3× the longest ≈ 180. Saturday's nine
  # rows against these windows: G4-1 ages 0.2–2.1 s (fresh); TR3 87.1–164.5 s (inside 180);
  # G4-2 152.6 / 375.6 / 598.7 s on ONE report (all three VOID).
  fresh-within-s:
    g4-1: 30
    tr3: 180
    g4-2: 30
  # step-s — the LOAD STEP's length per plug in the REP prompts ("LAMP out of <PLUG> for at least
  # ${C.metering.step-s.<plug>} seconds"): ≥ the plug's reporting cadence, so the 0 W and the
  # return are BOTH reported (a 15-s step is invisible to a plug whose cadence is ≈ 60 s — the
  # TR3's three reps on Saturday compared A-now to the plug's pre-step steady value).
  step-s:
    g4-1: 15
    tr3: 90
    g4-2: 15
  # bias-pct — each plug's MEASURED bias over A − TARE, from the unrounded-read ratios of the
  # nine rows (G4-1 2.19 / 2.44 on the 42-W reads; the TR3 7.1–8.9; G4-2's first read 2.94).
  # METER-3b (IR-75; D-v83-3 `BIAS: tolerate`, GIVEN Sun 2026-09-27): the REP's within/outside
  # is JUDGED on corrected_ratio = ratio / (1 + bias_pct/100) against the SAME band (engine
  # `field_within.bias_pct` at the decision site; the receipt names judged_on: "corrected_ratio"
  # and carries corrected_deviation_pct); the raw ratio and deviation_pct stay in the receipt
  # beside it. A line with no bias_pct is judged on the raw ratio (judged_on: "ratio"), its
  # verdict byte-identical to before. The band above stays the guaranteed figure; the other arm
  # of Nick's policy word, `BIAS: exclude` (a biased plug carries no accuracy-bearing load), is
  # decided at the packet, not here (IR-62).
  bias-pct:
    g4-1: 2.3
    tr3: 8.0
    g4-2: 2.9

