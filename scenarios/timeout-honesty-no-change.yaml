# timeout-honesty-no-change — THE NEVER-FALSE-CONFIRMED REGRESSION,
# runnable nightly. Command the CURRENT value (the let: pre-read feeds the
# same level back): the no-change class produces no report (measured live
# in the acceptance run), so the lifecycle read MUST reach the TIMED-OUT
# terminal phase — a CONFIRMED read for this command is the FAIL evidence.
#
# ================================ LIVE (B2) ==================================
# B2 (2026-07-28): command-api is LIVE (CMD-API landed 5b4797e, deployed
# in c09c61c) — this scenario flips live with the constants re-mint, per
# Nick's "(c) + (a)" ruling 2026-07-12 (the stubs flip with B2's port).
# All command-plane paths/fields RE-PINNED at rest-api source (constants
# .yaml command-lifecycle block carries the file:line set). ONE body fix
# rode the re-pin: `capability` is a REQUIRED body field on the live wire
# (IssueCommandEndpoint.java:263-277) — absent pre-B2, a guaranteed 400
# (a named B2 finding; this file's only B2 edit beyond this banner).
# NOTE: the Hue's physical absence (HUE-RESET pending) does NOT gate this
# scenario — commanding the CURRENT value produces no report and times
# out honestly whether or not the lamp is on-network; the premise is the
# no-change class, not device reachability. (If HUE-RESET lands and the
# no-change class starts CONFIRMING, that is the never-false-CONFIRMED
# STOP, exactly what this scenario exists to catch.)
# =============================================================================
#
# within: anchor — the 15,000 ms tuned confirmation window + decisive
# margin = 30 s (the no-change class times out at the window, never
# before; acceptance record: proven live, three organic timeout classes).
#
# Terminal-phase exclusivity: the CONFIRMED-class phase must NEVER appear
# for this command. The engine's phase_terminal assert enforces it — any
# WRONG terminal phase fails IMMEDIATELY with the read quoted (a terminal
# phase can never right itself), so a false CONFIRMED is caught the moment
# it is read, not at the deadline.

scenario: timeout-honesty-no-change
tier: AUTO
requires: [command-api]

preconditions:
  app: running

let:
  - name: current_brightness
    # brightness_percent = the level-comparable attribute; .value = the
    # LIVE /state dialect — MEASURED 2026-07-29/30 (the B2 Pi half: the
    # S-1 probe, the Hue's own /state read, AND this scenario's first
    # suite FAIL, whose quoted body served {"value": ...} nesting at the
    # exact moment the old .v lookup died). The desk's {t,v} pin read
    # AttributeValueSerializer, which feeds the ENTITY read, not /state.
    # Re-pin when STATE-DIALECT (core P2) lands.
    api:
      path: "/api/v1/entities/${C.command.entity}/state"
      field: "data.attributes.brightness_percent.value"

stimulus:
  - api:                          # re-pinned at source (B2, core c09c61c)
      method: POST
      path: "/api/v1/entities/${C.command.entity}/commands"
      body:
        capability: brightness    # REQUIRED on the live wire (B2 fix —
        command: set_brightness   #   header banner; IssueCommandEndpoint
        parameters:               #   .java:263-277)
          level: "${let.current_brightness}"    # the SAME value — no change
      capture:
        name: command_id
        field: "data.commandId"   # re-pinned: IssueCommandEndpoint.java:365

evidence:
  positive:
    - api:
        path: "/api/v1/commands/${let.command_id}"
        assert:
          phase_terminal: "${C.command-lifecycle.timed-out-class}"
      within: 30s
    - api:                        # state unchanged at verdict time
        path: "/api/v1/entities/${C.command.entity}/state"
        assert:
          field_equals:
            field: "data.attributes.brightness_percent.value"
            value: "${let.current_brightness}"
      within: 5s
  forbidden: []
  # Exclusivity rides phase_terminal's fail-fast mismatch (above) — a
  # CONFIRMED terminal read fails the scenario with the response quoted.

verdict:
  pass: all positive within timeouts AND zero forbidden
  bundle: always
