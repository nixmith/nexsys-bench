# command-confirm — the CONFIRMED-class happy path: command a DIFFERENT
# brightness (the let: pre-read + other_of guarantee a real change), then
# the lifecycle read reaches the CONFIRMED terminal phase and the state
# view reflects the commanded value.
#
# ========================= SKIPPED-HONEST (hue-online) =======================
# B2 (2026-07-28): command-api is LIVE (CMD-API landed 5b4797e, deployed
# in c09c61c — the constants flip carries the citation) and every command-
# plane path/field below is RE-PINNED at rest-api source (constants.yaml
# command-lifecycle block carries the file:line set; PROVISIONAL markers
# removed). The scenario now gates on `hue-online` INSTEAD: the Hue is
# physically off-network pending HUE-RESET (standing note 2026-07-21; I3b
# §5.1 — five commands, zero CONFIRMED, measured), so running this
# CONFIRMED-class scenario against the absent lamp would false-FAIL a
# correct platform. SKIPPED-honest on [hue-online] preserves the ruling's
# shape (Nick's "(c) + (a)" 2026-07-12: present in the suite, reported
# SKIPPED with the named reason, never silently absent, never vacuously
# green) until HUE-RESET lands; the scenario itself is already correct as
# authored. The device-absent class is NOT lost meanwhile —
# command-timeout-absent consumes the absence deliberately (B2 §5.3).
# =============================================================================
#
# within: anchors — brightness CONFIRMED 0.33 s measured (acceptance record
# pos 578); CT 0.68-3.7 s; the tuned window is 15,000 ms. 20 s is decisive
# headroom ABOVE the window, so a slow-but-honest confirm never false-FAILs.
#
# Skips-honestly note: if the bulb is unpowered, the command times out
# honestly (the absent-device class) — the plug `requires` upgrade
# automates that precondition later (plug capability + a plug: on
# precondition step; driver already ships).

scenario: command-confirm
tier: AUTO
requires: [command-api, hue-online]

preconditions:
  app: running

let:
  - name: current_brightness
    # brightness_percent is the level-comparable attribute (acceptance
    # RUNBOOK Phase 5: "state shows brightness=127 AND brightness_percent=50",
    # query-derived — MaterializedStateQueryService BRIGHTNESS_PERCENT_KEY
    # :113 at c09c61c; the set_brightness level parameter is 0-100 —
    # StandardCapabilities.java:178-183). The trailing .v is the
    # AttributeValue envelope's value field ({"t":...,"v":...} —
    # AttributeValueSerializer.java:68/:70). Re-pinned at source, B2
    # 2026-07-28.
    api:
      path: "/api/v1/entities/${C.command.entity}/state"
      field: "data.attributes.brightness_percent.v"
  - name: target_level
    # The OTHER of C's two levels — guarantees a real change (DP-2).
    other_of:
      levels: "${C.command.levels}"
      not: "${let.current_brightness}"

stimulus:
  - api:                          # route + body shape re-pinned at source
      method: POST                # (B2 2026-07-28, core c09c61c):
      path: "/api/v1/entities/${C.command.entity}/commands"
      body:
        # capability is a REQUIRED body field on the live wire
        # (IssueCommandEndpoint.java:263-277: capability + command +
        # parameters all required) — absent pre-B2, a guaranteed 400;
        # the B2 re-pin caught and fixed it (a named finding).
        capability: brightness
        command: set_brightness
        parameters:
          level: "${let.target_level}"
      capture:
        name: command_id
        field: "data.commandId"   # re-pinned: IssueCommandEndpoint.java:365

evidence:
  positive:
    - api:                        # the per-command verdict read — never a
        path: "/api/v1/commands/${let.command_id}"        # log line
        assert:
          phase_terminal: "${C.command-lifecycle.confirmed-class}"
      within: 20s
    - api:
        path: "/api/v1/entities/${C.command.entity}/state"
        assert:
          field_equals:
            field: "data.attributes.brightness_percent.v"
            value: "${let.target_level}"
      within: 20s
  forbidden: []
  # None needed beyond terminal-phase exclusivity (base DP-8 row 2): a
  # TIMED_OUT terminal read FAILS the phase_terminal positive on mismatch,
  # quoted — the engine fails fast on any wrong terminal phase.

verdict:
  pass: all positive within timeouts AND zero forbidden
  bundle: always
